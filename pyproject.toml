[project]
name = "prophet-batch-examples"
version = "0.0.0"
description = "Runnable use cases for prophet-batch: accuracy and speed against stock Prophet"
requires-python = ">=3.12,<3.13"
dependencies = [
    "prophet==1.5.0",
    "prophet-batch",
]

[dependency-groups]
# Local notebooks and plots; the container images install only the runtime dependencies.
notebook = [
    "jupyter",
    "matplotlib",
]

[tool.uv]
package = false
default-groups = ["notebook"]

[tool.uv.sources]
# For now prophet-batch comes from a clone next to this repo
# (github.com/sumedhekaru/prophet-batch); PyPI later.
prophet-batch = { path = "../prophet-batch", editable = true }
